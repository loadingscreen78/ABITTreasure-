name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit + content-integrity (placeholder content) + Postgres integration (PGlite, real migrations, RLS)
      - run: npm test
      - run: npm run check:design
      - run: npm run build
      # No secret key or sb_secret_ value in .next/static or any "use client" file
      - run: npm run check:secrets
      # No riddle / nudge / secret word / answer in client bundles
      - run: npm run check:leaks
